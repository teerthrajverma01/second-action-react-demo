name: Deployment Project
on: push
jobs: 
  test: 
    runs-on: ubuntu-latest
    steps: 
      - name: get code download from repo
        uses: actions/checkout@v7 
      - name: install nodejs
        uses: actions/setup-node@v7
        with: 
          node-version: '26'
      - name: install dependencies
        run: npm ci
      - name: run test
        run: npm test
  deploy: 
    needs: [test,]
    runs-on: ubuntu-latest
    steps: 
      - name: get code download from repo
        uses: actions/checkout@v7 
      - name: install nodejs
        uses: actions/setup-node@v7
        with: 
          node-version: '26'
      - name: install dependencies
        run: npm ci
      - name: build project
        run: npm run build
      - name: deploy
        run: echo "deploying"
